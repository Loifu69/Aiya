<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Aiya - Pengingat Minum Dinamis & Sosial</title>
    <meta name="description" content="Aplikasi pengingat minum dinamis dengan alarm suara air, pengingat berulang sampai kamu minum, dan fitur saling mengingatkan antar teman." />
    <meta name="theme-color" content="#0284c7" />
    <script>
      // Apply dark mode before the first paint (no white flash). Same logic as src/utils/theme.ts
      try {
        var t = localStorage.getItem('aiya_theme_v1') || 'system';
        if (t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0f172a');
        }
      } catch (e) {}
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Aiya" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta property="og:title" content="Aiya - Pengingat Minum Dinamis & Sosial" />
    <meta property="og:description" content="Aplikasi pengingat minum dinamis dengan alarm suara air, pengingat berulang sampai kamu minum, dan fitur saling mengingatkan antar teman." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased selection:bg-sky-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
